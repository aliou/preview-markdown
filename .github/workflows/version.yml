name: Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create release for current version'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 1>/dev/null 2>&1; then
            # Check if any non-README changeset files exist
            count=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
            if [ "$count" -gt "0" ]; then
              echo "hasChangesets=true" >> $GITHUB_OUTPUT
            else
              echo "hasChangesets=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "hasChangesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version
        if: steps.check.outputs.hasChangesets == 'true'
        id: version
        run: |
          pnpm run version
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release PR
        if: steps.version.outputs.version
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "release: v${{ steps.version.outputs.version }}"
          title: "release: v${{ steps.version.outputs.version }}"
          body: |
            This PR was auto-generated to release v${{ steps.version.outputs.version }}.
            
            Merging will create a git tag and GitHub release.
          branch: release/v${{ steps.version.outputs.version }}
          delete-branch: true

      - name: Decide whether to release
        id: release
        if: steps.check.outputs.hasChangesets == 'false' || inputs.force_release
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"

          # Skip if tag already exists (unless force_release)
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            if [ "${{ inputs.force_release }}" != "true" ]; then
              echo "Tag ${TAG} already exists, skipping"
              exit 0
            fi
          fi

          echo "release=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: pmd-*
          path: dist
          merge-multiple: true

      - name: Release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "Releasing ${TAG}..."

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update flake.nix with the binary hashes
          sri() { echo "sha256-$(openssl dgst -binary -sha256 "$1" | openssl base64 -A)"; }
          DARWIN_HASH=$(sri dist/pmd-darwin-arm64)
          LINUX_ARM_HASH=$(sri dist/pmd-linux-arm64)
          LINUX_X64_HASH=$(sri dist/pmd-linux-x64)
          echo "Darwin hash: $DARWIN_HASH"
          echo "Linux ARM64 hash: $LINUX_ARM_HASH"
          echo "Linux x64 hash: $LINUX_X64_HASH"
          sed -i "s|hash = \"sha256-.*\"; # darwin|hash = \"${DARWIN_HASH}\"; # darwin|" flake.nix
          sed -i "s|hash = \"sha256-.*\"; # linux-arm64|hash = \"${LINUX_ARM_HASH}\"; # linux-arm64|" flake.nix
          sed -i "s|hash = \"sha256-.*\"; # linux-x64|hash = \"${LINUX_X64_HASH}\"; # linux-x64|" flake.nix

          # Commit hash update if changed
          git add flake.nix
          if ! git diff --cached --quiet; then
            git commit -m "chore: update binary hashes for ${TAG}"
            git push origin main
          else
            echo "No hash changes needed"
          fi

          # Create tag and release
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            dist/pmd-darwin-arm64 \
            dist/pmd-linux-arm64 \
            dist/pmd-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
